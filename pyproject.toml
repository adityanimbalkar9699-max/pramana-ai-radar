[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pramana-ai-radar"
version = "1.0.0"
description = "Autonomous Free AI Tools Intelligence, Verification & Discovery System for Computer Engineering Students"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "lxml>=5.0.0",
    "Flask>=3.0.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "tenacity>=8.2.0",
]

[project.scripts]
pramana = "pramana.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
