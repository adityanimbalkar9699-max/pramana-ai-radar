name: Pramana Weekly AI Intelligence Report

on:
  schedule:
    - cron: "30 3 * * 0" # Sundays 09:00 IST (03:30 UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  weekly-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Weekly Intelligence & Top 10 PDF Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python -m pramana.cli weekly

      - name: Commit Weekly Reports & Updated DB
        run: |
          git config user.name "pramana-bot"
          git config user.email "pramana-bot@users.noreply.github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore(weekly): weekly intelligence report & Top 10 PDF $(date -u +%Y-W%V)"
            git pull --rebase origin main || true
            git push
          fi

      - name: Upload Weekly PDF / Excel / CSV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pramana-weekly-bundle-${{ github.run_id }}
          path: |
            data/weekly_reports/*.pdf
            data/weekly_reports/*.xlsx
            data/weekly_reports/*.csv
            data/weekly_reports/*.md
          retention-days: 90

      - name: Failure Recovery Alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pramana Weekly Report Failed (${new Date().toISOString().slice(0,10)})`,
              body: `Weekly intelligence run failed. Logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
